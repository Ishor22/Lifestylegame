name: Android signing setup (one-time)

# Creates the Android release signing key ONCE.
# - Stops before creating anything if ANY of the four signing secrets already exists.
# - Creates an authenticated, encrypted backup (AES-256-GCM) and verifies it by restoring it
#   before any secret is written.
# - Uploads the backup as an artifact BEFORE saving secrets, so the key is never saved without a backup.
# - Never prints passwords, tokens or key material.
# - If saving secrets fails partway, do NOT run this workflow again. Run "Android signing restore"
#   with the same run ID instead. See docs/android-release-setup.md.
# Delete ANDROID_SETUP_TOKEN after this run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE-ANDROID-KEY to confirm (only the first time)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-signing-secrets
  cancel-in-progress: false

jobs:
  create-key:
    name: Create signing key once
    runs-on: ubuntu-latest
    if: inputs.confirm == 'CREATE-ANDROID-KEY'
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.ANDROID_SETUP_TOKEN }}
      REPO: ${{ github.repository }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17 (keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python and pinned crypto library
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned cryptography version
        run: python3 -m pip install --disable-pip-version-check "cryptography==50.0.1"

      - name: Create key and verified encrypted backup
        # Phase 1: refuses if any signing secret exists; creates the key and the backup; verifies the backup.
        env:
          WORK: ${{ runner.temp }}/keysetup
          OUT: ${{ runner.temp }}/backup-out
        run: bash scripts/android-signing/setup_key.sh backup

      - name: Upload encrypted backup artifact
        # A temporary copy only. Save this file to iCloud Drive; restore does not need the artifact.
        uses: actions/upload-artifact@v4
        with:
          name: my-life-android-signing-backup
          path: ${{ runner.temp }}/backup-out/my-life-android-signing-backup.txt
          retention-days: 90
          if-no-files-found: error

      - name: Save the four signing secrets
        # Phase 2: runs only after the backup is uploaded. Stops if any secret exists.
        env:
          WORK: ${{ runner.temp }}/keysetup
        run: bash scripts/android-signing/setup_key.sh save

      - name: Remove temporary key material
        if: always()
        env:
          WORK: ${{ runner.temp }}/keysetup
          OUT: ${{ runner.temp }}/backup-out
        run: rm -rf "${WORK}" "${OUT}"
