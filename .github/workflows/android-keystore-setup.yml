name: Android signing setup (one-time)

# Creates the Android release signing key ONCE.
# - Refuses to run if the signing secrets already exist (never overwrites a key).
# - Never prints passwords or keystore contents.
# - Stores an encrypted backup as a workflow artifact (download needs GitHub sign-in).
# - Writes the four signing secrets itself using the ANDROID_SETUP_TOKEN secret.
# Delete ANDROID_SETUP_TOKEN after this run succeeds.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE-ANDROID-KEY to confirm (only the first time)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-key:
    name: Create signing key once
    runs-on: ubuntu-latest
    if: inputs.confirm == 'CREATE-ANDROID-KEY'
    timeout-minutes: 15
    env:
      SETUP_TOKEN: ${{ secrets.ANDROID_SETUP_TOKEN }}
      EXISTING_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check preconditions (values are never printed)
        run: |
          set -euo pipefail
          if [ -n "${EXISTING_KEYSTORE}" ]; then
            echo "::error::A signing key is already configured. Refusing to create another one." >&2
            exit 1
          fi
          if [ -z "${SETUP_TOKEN}" ]; then
            echo "::error::Secret ANDROID_SETUP_TOKEN is missing." >&2
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::Secret BACKUP_PASSPHRASE is missing or shorter than 16 characters." >&2
            exit 1
          fi
          echo "Preconditions OK. No signing key exists yet."

      - name: Generate key and encrypted backup
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/keysetup"
          mkdir -m 700 "${WORK}"

          STORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::${STORE_PASS}"
          export STORE_PASS

          keytool -genkeypair \
            -keystore "${WORK}/upload.jks" -storetype PKCS12 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env STORE_PASS -keypass:env STORE_PASS \
            -dname "CN=My Life Business Tycoon, OU=Mobile, O=Lifestylegame, C=US" \
            -noprompt

          # Keep the password and alias next to the key, inside the encrypted backup only.
          {
            echo "ANDROID_KEYSTORE_PASSWORD=${STORE_PASS}"
            echo "ANDROID_KEY_PASSWORD=${STORE_PASS}"
            echo "ANDROID_KEY_ALIAS=upload"
          } > "${WORK}/credentials.env"
          chmod 600 "${WORK}/credentials.env" "${WORK}/upload.jks"

          # Encrypted backup: AES-256, PBKDF2, passphrase from the BACKUP_PASSPHRASE secret.
          OUT="${GITHUB_WORKSPACE}/backup-out"
          mkdir -p "${OUT}"
          tar -C "${WORK}" -cf "${RUNNER_TEMP}/android-signing.tar" upload.jks credentials.env
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "${RUNNER_TEMP}/android-signing.tar" \
            -out "${OUT}/my-life-android-signing-backup.enc" \
            -pass env:BACKUP_PASSPHRASE
          rm -f "${RUNNER_TEMP}/android-signing.tar"

          # Verify the backup decrypts and the key works, without printing secrets.
          VERIFY="${RUNNER_TEMP}/verify"
          mkdir -m 700 "${VERIFY}"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "${OUT}/my-life-android-signing-backup.enc" \
            -out "${VERIFY}/restored.tar" -pass env:BACKUP_PASSPHRASE
          tar -C "${VERIFY}" -xf "${VERIFY}/restored.tar"
          set -a; . "${VERIFY}/credentials.env"; set +a
          keytool -list -keystore "${VERIFY}/upload.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias upload \
            | grep -E "SHA-256" | sed 's/^/Certificate /' >> "$GITHUB_STEP_SUMMARY" || true
          keytool -list -keystore "${VERIFY}/upload.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias upload >/dev/null
          rm -rf "${VERIFY}"

          # Keep the plaintext for the next steps (secrets), in RUNNER_TEMP only.
          echo "Backup created and verified."

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-life-android-signing-backup-encrypted
          path: backup-out/my-life-android-signing-backup.enc
          retention-days: 90
          if-no-files-found: error

      - name: Save the four signing secrets
        env:
          GH_TOKEN: ${{ secrets.ANDROID_SETUP_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/keysetup"
          set -a; . "${WORK}/credentials.env"; set +a
          echo "::add-mask::${ANDROID_KEYSTORE_PASSWORD}"
          # Values go through stdin so they never appear in command lines or logs.
          printf '%s' "${ANDROID_KEYSTORE_PASSWORD}" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "${REPO}"
          printf '%s' "${ANDROID_KEY_PASSWORD}"      | gh secret set ANDROID_KEY_PASSWORD --repo "${REPO}"
          printf '%s' "${ANDROID_KEY_ALIAS}"         | gh secret set ANDROID_KEY_ALIAS --repo "${REPO}"
          base64 -w0 "${WORK}/upload.jks" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "${REPO}"
          echo "Signing secrets saved to the repository." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up plaintext key material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/keysetup" "${RUNNER_TEMP}/android-signing.tar" "${RUNNER_TEMP}/verify" || true
          rm -rf "${GITHUB_WORKSPACE}/backup-out" || true
