name: Android signing restore

# Restores the SAME signing key from your saved backup text.
#
# Source of the backup: the repository secret ANDROID_SIGNING_BACKUP, which you paste from the
# my-life-android-signing-backup.txt file you saved in iCloud Drive. The GitHub artifact is NOT needed.
#
# Safety rules, enforced by restore_key.sh before anything is written:
# - Never generates a key.
# - 0 of 4 secrets exist: restore proceeds.
# - 1 to 3 exist: needs partial_confirm = COMPLETE-PARTIAL-RESTORE.
# - All 4 exist: refused unless replace_confirm = REPLACE-COMPLETE-SIGNING-KEY.
# - Stops if the restored certificate SHA-256 does not match the fingerprint recorded at creation.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE-SAME-KEY to confirm'
        required: true
        type: string
      partial_confirm:
        description: 'Only if 1 to 3 signing secrets exist: type COMPLETE-PARTIAL-RESTORE'
        required: false
        default: ""
        type: string
      replace_confirm:
        description: 'Only if all 4 signing secrets exist: type REPLACE-COMPLETE-SIGNING-KEY (replacing a published key can block future app updates)'
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-signing-secrets
  cancel-in-progress: false

jobs:
  restore:
    name: Restore signing key from backup text
    runs-on: ubuntu-latest
    if: inputs.confirm == 'RESTORE-SAME-KEY'
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.ANDROID_SETUP_TOKEN }}
      REPO: ${{ github.repository }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SIGNING_BACKUP: ${{ secrets.ANDROID_SIGNING_BACKUP }}
      PARTIAL_CONFIRM: ${{ inputs.partial_confirm }}
      REPLACE_CONFIRM: ${{ inputs.replace_confirm }}
      WORK: ${{ runner.temp }}/restore-work
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17 (keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned cryptography version
        run: python3 -m pip install --disable-pip-version-check "cryptography==50.0.1"

      - name: Restore the same key and write the four secrets
        # Never generates a key. Applies the overwrite policy before decrypting or writing.
        run: bash scripts/android-signing/restore_key.sh

      - name: Remove temporary key material
        if: always()
        run: rm -rf "${WORK}"
